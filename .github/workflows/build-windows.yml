name: Build Windows EXE

# main.py 를 윈도우 클라우드 러너에서 PyInstaller 로 빌드해
# 단일 .exe (ffmpeg 번들 포함) 를 아티팩트로 올린다.
# 맥에서는 gh run download 로 내려받으면 된다.

on:
  push:
    branches: [main]
  workflow_dispatch:  # Actions 탭에서 수동 실행도 가능

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg (static build)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $exe = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination ffmpeg.exe
          Write-Host "ffmpeg copied:" (Get-Item ffmpeg.exe).Length "bytes"

      - name: Build EXE (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole `
            --name "youtube-audio-downloader" `
            --collect-all customtkinter `
            --add-binary "ffmpeg.exe;." `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-audio-downloader-exe
          path: dist/youtube-audio-downloader.exe
          if-no-files-found: error
