name: Build Windows EXE

# main.py 를 윈도우 러너에서 PyInstaller 로 빌드한다.
#  - ffmpeg: 오디오 전용 ffmpeg 를 공식 소스에서 정적 빌드 (tools/ffmpeg/build.sh). lite/full 이 이걸 번들한다.
#  - lite: 다운로드만. 단일 exe (ffmpeg 번들)
#  - full: 스템 분리 포함. torch 가 커서 onedir 폴더를 zip 으로 (모델 가중치 hf_home 포함)
#  - tempofollow: 템포 추종 사이드 앱. onedir 폴더를 zip 으로
#  - hub: 설치·업데이트 관리자. 단일 exe
#  - package: 릴리스 파일을 모아 manifest.json 을 만들고, 빌드된 허브로 빌드된 앱을 설치·실행·삭제해 본다
#  - release: 버전 태그(v*)일 때만. package 가 만든 묶음을 해시 대조 후 GitHub Release 로 게시한다
# 맥에서는 gh run download 로 내려받으면 된다.

on:
  push:
    branches: [main]
    tags: ["v*"]      # 버전 태그를 올리면 빌드 후 release 작업이 릴리스를 게시한다
  workflow_dispatch:

jobs:
  # 오디오 전용 ffmpeg 를 공식 소스에서 정적 빌드한다 (tools/ffmpeg/build.sh).
  # build.sh 가 바뀌지 않으면 캐시에서 꺼내 스모크 테스트만 다시 돈다.
  build-ffmpeg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: tools/ffmpeg/out/ffmpeg.exe
          key: ffmpeg-audio-${{ hashFiles('tools/ffmpeg/build.sh', 'tools/ffmpeg/msys2-packages.txt') }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: python mingw-w64-x86_64-binutils

      - name: Build audio-only ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed $(tr -d '\r' < tools/ffmpeg/msys2-packages.txt)
          bash tools/ffmpeg/build.sh

      - name: Smoke test + dependency check
        shell: msys2 {0}
        run: |
          bash tools/ffmpeg/smoke.sh tools/ffmpeg/out/ffmpeg.exe
          dlls="$(objdump -p tools/ffmpeg/out/ffmpeg.exe | grep "DLL Name" | sed 's/.*DLL Name: //')"
          echo "$dlls"
          extra="$(echo "$dlls" | grep -viE '^(kernel32|user32|advapi32|shell32|ole32|oleaut32|psapi|bcrypt|ncrypt|crypt32|secur32|ws2_32|iphlpapi|msvcrt|ucrtbase|api-ms-win-.*)\.dll$' || true)"
          if [ -n "$extra" ]; then echo "non-system DLL dependency: $extra"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-audio
          path: tools/ffmpeg/out/ffmpeg.exe
          if-no-files-found: error

  build-lite:
    needs: build-ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Get audio-only ffmpeg (built by build-ffmpeg job)
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-audio
          path: .

      - name: Report ffmpeg size
        shell: pwsh
        run: Get-Item ffmpeg.exe | Select-Object Name, Length

      - name: Build EXE (PyInstaller, onefile)
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole `
            --name "splitwave" `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --add-binary "ffmpeg.exe;." `
            --exclude-module PIL._avif --exclude-module PIL._webp `
            main.py

      - name: Selftest built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\splitwave.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Report size
        shell: pwsh
        run: Get-Item dist\splitwave.exe | Select-Object Name, Length      # lite

      - uses: actions/upload-artifact@v4
        with:
          name: splitwave-lite-exe
          path: dist/splitwave.exe
          if-no-files-found: error

  build-full:
    needs: build-ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (with demucs + torch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-stems.txt pyinstaller -c constraints-full.txt

      - name: Get audio-only ffmpeg (built by build-ffmpeg job)
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-audio
          path: .

      - name: Report ffmpeg size
        shell: pwsh
        run: Get-Item ffmpeg.exe | Select-Object Name, Length

      - name: Unit tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q -rs

      - name: Prefetch Demucs weights into hf_home
        shell: pwsh
        env:
          HF_HOME: ${{ github.workspace }}\hf_home
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: |
          python -c "import demucs.api; from separator import MODEL_NAME; s = demucs.api.Separator(model=MODEL_NAME, device='cpu'); print('sources', s.model.sources)"
          Get-ChildItem -Recurse hf_home | Measure-Object -Property Length -Sum | Select-Object Sum

      - name: Prune duplicate weight copies (materialize links, keep snapshots only)
        shell: pwsh
        env:
          HF_HOME: ${{ github.workspace }}\hf_home
          HF_HUB_OFFLINE: "1"
        run: |
          # snapshots 의 링크를 실제 파일로 바꾸고 blob/xet 저장소를 지운다. 가중치가 안 남으면 여기서 실패.
          python tools/prune_hf_cache.py hf_home
          if ($LASTEXITCODE -ne 0) { throw "prune failed" }
          Get-ChildItem -Recurse -File hf_home | Measure-Object -Property Length -Sum | Select-Object Sum
          # 정리한 캐시로 실제 로드되는지 빌드 전에 먼저 확인 (실패하면 여기서 멈춤)
          python main.py --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest on pruned cache failed" }

      - name: Build (PyInstaller, onedir)
        shell: pwsh
        run: |
          pyinstaller --onedir --noconsole `
            --name "splitwave-full" `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --collect-all demucs `
            --add-binary "ffmpeg.exe;." `
            --add-data "hf_home;hf_home" `
            --exclude-module PIL._avif --exclude-module PIL._webp `
            --exclude-module torch._dynamo --exclude-module torch._inductor --exclude-module torch.onnx `
            --exclude-module sympy --exclude-module mpmath --exclude-module networkx `
            --exclude-module hf_xet `
            main.py

      - name: Prune unused torch tools
        shell: pwsh
        run: Remove-Item -Recurse -Force dist\splitwave-full\_internal\torch\bin -ErrorAction SilentlyContinue

      - name: Selftest built exe (offline, bundled weights)
        # HF_HOME 을 여기서 지정하면 안 된다 — exe 안의 configure_bundled_model_cache 가
        # setdefault 로 번들 경로를 넣으므로, 비워 둬야 번들 가중치로 로드되는지 검증된다.
        # (러너 기본 캐시는 비어 있다: 앞 단계가 HF_HOME 을 hf_home 으로 바꿔 받았기 때문)
        shell: pwsh
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          $p = Start-Process -FilePath ".\dist\splitwave-full\splitwave-full.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: 7z a -tzip -mx=9 splitwave-full.zip .\dist\splitwave-full

      - name: Verify zip contains the model weights
        shell: pwsh
        run: |
          $lines = @(7z l splitwave-full.zip | Select-String -Pattern "\.safetensors$")
          if ($lines.Count -eq 0) { throw "no .safetensors inside splitwave-full.zip" }
          foreach ($l in $lines) {
            $size = [int64](($l.Line.Trim() -split "\s+")[3])
            Write-Host "weights in zip: $size bytes ($($l.Line.Trim().Split(' ')[-1]))"
            if ($size -lt 10000000) { throw "weights inside zip look truncated ($size bytes)" }
          }

      - name: Report size
        shell: pwsh
        run: Get-Item splitwave-full.zip | Select-Object Name, Length      # full

      - uses: actions/upload-artifact@v4
        with:
          name: splitwave-full-zip
          path: splitwave-full.zip
          if-no-files-found: error

  # 템포 추종 사이드 앱. 오디오 장치가 없는 러너라서 selftest 는 스트림을 열지 않는다.
  build-tempofollow:
    needs: build-ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tempofollow.txt pyinstaller

      - name: Get audio-only ffmpeg (built by build-ffmpeg job)
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-audio
          path: .

      - name: Build (PyInstaller, onedir)
        shell: pwsh
        run: |
          pyinstaller --onedir --noconsole `
            --name "tempofollow" `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --add-binary "ffmpeg.exe;." `
            --exclude-module PIL._avif --exclude-module PIL._webp `
            tempofollow_main.py

      - name: Selftest built exe
        shell: pwsh
        env:
          SELFTEST_LOG: ${{ github.workspace }}\selftest.log
        run: |
          $p = Start-Process -FilePath ".\dist\tempofollow\tempofollow.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: 7z a -tzip -mx=9 tempofollow.zip .\dist\tempofollow

      - name: Report size
        shell: pwsh
        run: Get-Item tempofollow.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: tempofollow-zip
          path: tempofollow.zip
          if-no-files-found: error

  # 허브(설치·업데이트 관리자). 앱을 담지 않고 릴리스에서 받아 온다.
  build-hub:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow pyinstaller pytest

      - name: Unit tests (hub, manifest tool)
        run: python -m pytest -q -rs tests/test_hub_core.py tests/test_hub_cli.py tests/test_hub_app.py tests/test_make_manifest.py tests/test_split_parts.py

      - name: Build EXE (PyInstaller, onefile)
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole `
            --name "splitwave-hub" `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --exclude-module PIL._avif --exclude-module PIL._webp `
            hub_main.py

      - name: Selftest built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\splitwave-hub.exe" -ArgumentList "--selftest","--root","$PWD\selftest-root" -Wait -PassThru -NoNewWindow
          if (Test-Path selftest-root\hub.log) { Get-Content selftest-root\hub.log }
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Report size
        shell: pwsh
        run: Get-Item dist\splitwave-hub.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: splitwave-hub-exe
          path: dist/splitwave-hub.exe
          if-no-files-found: error

  # 릴리스에 올릴 파일을 한곳에 모으고 매니페스트를 만든 뒤,
  # 빌드된 허브로 빌드된 앱을 실제로 설치, 실행(selftest), 삭제해 본다.
  package:
    needs: [build-lite, build-full, build-tempofollow, build-hub]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files and build manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item artifacts\splitwave-lite-exe\splitwave.exe release\
          Copy-Item artifacts\splitwave-full-zip\splitwave-full.zip release\
          Copy-Item artifacts\tempofollow-zip\tempofollow.zip release\
          Copy-Item artifacts\splitwave-hub-exe\splitwave-hub.exe release\
          # 풀 버전을 허브용 묶음으로 나눈다 (잘 안 바뀌는 torch, 모델, 실행 환경과 매번 바뀌는 앱 본체)
          python tools/split_parts.py --apps tools/apps.json --dir release
          if ($LASTEXITCODE -ne 0) { throw "split_parts failed" }
          $v = (Get-Content VERSION).Trim()
          python tools/make_manifest.py --version $v --apps tools/apps.json --dir release
          if ($LASTEXITCODE -ne 0) { throw "make_manifest failed" }
          Get-ChildItem release | Select-Object Name, Length
          Get-Content release\manifest.json
          Get-Content release\SHA256SUMS.txt

      - name: End-to-end (built hub installs, runs and removes built apps)
        shell: pwsh
        env:
          HF_HUB_OFFLINE: "1"
          SELFTEST_LOG: ${{ github.workspace }}\e2e-selftest.log
        run: |
          $srv = Start-Process python -ArgumentList "-m","http.server","8765","--bind","127.0.0.1","--directory","release" -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          $hub = ".\release\splitwave-hub.exe"
          $common = @("cli","--root","$PWD\e2e","--base","http://127.0.0.1:8765")
          function Hub([string[]]$rest) {
            $p = Start-Process -FilePath $hub -ArgumentList ($common + $rest) -Wait -PassThru -NoNewWindow
            return $p.ExitCode
          }
          $apps = "splitwave","splitwave-full","tempofollow"
          try {
            foreach ($app in $apps) {
              if ((Hub @("install",$app)) -ne 0) { throw "install failed: $app" }
              if ((Hub @("run",$app,"--wait","--","--selftest")) -ne 0) { throw "selftest via hub failed: $app" }
            }
            if ((Hub @("install","splitwave")) -ne 0) { throw "second install (no-op) failed" }
            foreach ($app in $apps) {
              if ((Hub @("remove",$app)) -ne 0) { throw "remove failed: $app" }
              if (Test-Path "e2e\apps\$app") { throw "files left after remove: $app" }
            }
          } finally {
            if (Test-Path e2e-selftest.log) { Get-Content e2e-selftest.log }
            if (Test-Path e2e\hub.log) { Get-Content e2e\hub.log }
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  # 버전 태그(v*)를 올렸을 때만 돈다. package 가 검증한 묶음을 그대로 게시한다.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Tag must match VERSION, notes must exist
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "release: tag $GITHUB_REF_NAME does not match VERSION ($v). Fix: bump VERSION and retag."; exit 1
          fi
          if [ ! -f "docs/release-notes/$GITHUB_REF_NAME.md" ]; then
            echo "release: missing docs/release-notes/$GITHUB_REF_NAME.md. Fix: write the notes and retag."; exit 1
          fi

      - name: Verify checksums
        run: cd release && sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
